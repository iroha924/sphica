commit-msg:
  jobs:
    - name: commit-message
      run: node scripts/check-commit-msg.mjs {1}

pre-commit:
  parallel: true
  jobs:
    - name: actionlint
      glob: ".github/workflows/*.yml"
      run: mise exec -- actionlint {staged_files}
    - name: biome
      glob: "*.{ts,mts,tsx,js,mjs,cjs,json,jsonc}"
      run: server/node_modules/.bin/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: oxlint
      glob: "{server/src,server/test,server/evals,scripts}/**/*.{ts,mts,mjs}"
      run: node scripts/oxlint.mjs {staged_files}
    - name: typecheck-server
      root: server/
      glob: "*.ts"
      run: bun run typecheck
    # Structure only; links are checked over every document by the links job, since a heading changed here can break a link elsewhere
    - name: markdown
      glob: "*.md"
      run: node scripts/check-markdown.mjs {staged_files}
    - name: ai-config
      glob: "{AGENTS.md,CLAUDE.md,.agents/skills/**,.claude/skills/**,.claude/rules/**,.claude/agents/**,.claude-plugin/**,plugin/skills/review/reviewers/**,plugin/skills/**,scripts/check-ai-config.mjs,package.json}"
      # Links are checked by the links job on every commit
      run: node scripts/check-ai-config.mjs
    # Every document on every commit: a heading or file changed in one place can break a link in another
    - name: links
      run: mise exec -- node scripts/check-links.mjs
    # The version check only means something after bundle. As a separate job it runs in parallel,
    # reads the bundle before it is rebuilt, and passes vacuously (measured: passed 4 out of 4).
    - name: bundle
      # Matches the package inputs in release-scope.mjs (stops here a commit that changes inputs without bumping the version)
      glob: "{server/src/**,db/**,scripts/bundle.mjs,scripts/third-party-notices.mjs,scripts/licenses/**,server/package.json,server/bun.lock,server/tsconfig.json,plugin/**,.claude-plugin/**}"
      # Without set -e, the later check's 0 would cancel a failed bundle.
      run: |
        set -e
        bun run bundle
        bun run scripts/check-mcp-version.mjs
    # This checks only how SQL is written. Whether SQL ran against a real SQLite database (sql:reach) and the child process lane (sql:live)
    # rerun the tests, so CI checks them, and pre-push verify before a push to main.
    - name: sql
      glob: "{db/schema.sql,scripts/check-sql.mjs,scripts/lib/sql-style.mjs}"
      run: bun run sql
    - name: architecture
      glob: "{server/src/**/*.ts,scripts/check-architecture.mjs}"
      run: bun run architecture
    - name: english
      glob: "{server/src/*.ts,server/src/**/*.ts,scripts/*.mjs,scripts/**/*.mjs}"
      run: bun run english
    - name: codegen
      glob: "{db/schema.sql,server/src/db-types.ts,server/src/kysely-node-sqlite.ts,server/package.json,server/bun.lock,scripts/codegen.mjs}"
      run: bun run codegen:check
    - name: rule-scopes
      glob: "{.claude/rules/**,scripts/check-rule-scopes.mjs,server/**/*.ts,db/schema.sql,lefthook.yml,README.md,AGENTS.md,package.json}"
      run: bun run rule-scopes
    - name: pairs
      glob: "{db/schema.sql,server/src/*.ts,plugin/skills/review/SKILL.md,plugin/skills/review/reviewers/*.md,scripts/check-pairs.mjs,mise.toml,package.json,server/package.json,.github/workflows/*.yml}"
      run: node scripts/check-pairs.mjs

pre-push:
  jobs:
    # The commit-msg hook cannot tell `-m` from the editor, so a `-m '# body'` passes it and is stored as a body: the stored messages of the
    # pushed refs are checked first. Then verify runs before a push to main and check before any other push (every pull request runs verify
    # in CI). One job, since lefthook passes stdin to one job only. Lefthook skips it when the pushed commits change no files; CI still checks those.
    - name: pre-push
      use_stdin: true
      run: node scripts/pre-push.mjs
