# Tool versions for local development. CI pins the same Node floor and Bun in its workflows.
[tools]
node = "24.15.0"
bun = "1.4.0"
actionlint = "1.7.12"
# aqua's registry entry looks for asset names lychee no longer publishes; the release tags are lychee-v<version>
"github:lycheeverse/lychee" = { version = "0.24.2", version_prefix = "lychee-v" }
