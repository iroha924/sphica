# Checks what pre-commit does not.
#
# **The main value is the tests and SQL reach in `bun run verify`**: pre-commit does not run them; pre-push and CI do.
# The rest duplicates pre-commit, but closes the `--no-verify` and no-hooks paths here. The plugin version, though,
# is checked not per commit but across the whole range from the merge target or the pre-push commit to HEAD.
#
# **No secrets.** The database is SQLite in a temp directory, and the tests pass without credentials.
name: check

on:
  push:
    branches: [main]
  pull_request:

# It neither reasons nor writes anywhere, so it gets read access only.
permissions:
  contents: read

concurrency:
  # Runs for pushes to main are not cancelled. Cancelling one means the version check never sees that push's range.
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Checks that it passes on both the engines floor (24.15) and the next line (26). If one fails, the other's result is kept.
    strategy:
      fail-fast: false
      matrix:
        node: ["24.15", "26"]
    steps:
      # Third-party actions are pinned to a full commit SHA (a tag's contents can be swapped later).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetches the bases the version check compares against (the merge target and the pre-push commit).
          fetch-depth: 0
          persist-credentials: false

      # **Pin the bun version.** Letting it float picks versions that cannot read the lockfile
      # (actually hit on Vercel: 1.3.14 could not read lockfileVersion 2 and failed).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # Tests run on node's test runner, and the database uses Node's built-in node:sqlite.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # Placed before installing dependencies and verify. If a push to main fails earlier, its range is never checked.
      - name: Is the plugin version bumped
        env:
          # For a PR, the first parent of the checked-out merge commit is the merge target; for a push to main, the pre-push commit.
          # Whether a change reaches users depends on whether the version differs from the previous main, so the whole range is compared.
          # On a work branch, pre-commit compares against the fork point from main (scripts/check-mcp-version.mjs).
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: node scripts/check-mcp-version.mjs --base "$BASE"

      # Hooks can be skipped, so check what was actually committed: the PR's own commits, or the commits pushed to main.
      - name: commit message
        env:
          RANGE: ${{ github.event_name == 'pull_request' && 'HEAD^1..HEAD^2' || format('{0}..HEAD', github.event.before) }}
        run: node scripts/check-commit-msg.mjs --range "$RANGE"

      # The links check in verify (verify:ai) needs lychee; the version matches mise.toml (bun run pairs checks it)
      - name: Install lychee
        env:
          LYCHEE: "0.24.2"
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lychee"
          cd "$RUNNER_TEMP/lychee"
          curl -fsSLo lychee.tar.gz "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum -c -
          tar xzf lychee.tar.gz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP/lychee" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun run setup

      # Uses the same source of truth as the local pre-push: Biome, types, the package bundle, tests (with sql:reach counting whether every SQL
      # ran against a real SQLite database), and sql:live, which runs the CLI and capture as child processes against a database in a temp HOME.
      # On Node 26 the tests run in a random order, from a seed printed in the log, so a test that leans on another's leftovers shows up.
      # The flag goes to the test command, not NODE_OPTIONS, which children would inherit (a child node refuses --test-randomize without --test)
      - name: Lint, types, bundle, tests, SQL reach, and the child process lane
        env:
          TEST_ORDER: ${{ matrix.node == '26' && format('--test-randomize --test-random-seed={0}', github.run_number) || '' }}
        run: bun run verify

      # **Check what ships as a tarball.** dist and db are untracked, so `git diff` shows nothing.
      # The same script as release checks the file list, starting outside the repository, and creating a database.
      - name: Is the shipped tarball self-contained
        run: |
          set -e
          cd plugin
          tgz="$(npm pack --silent)"
          node ../scripts/check-tarball.mjs "$tgz"

  # **What ships must run on Windows too** (AGENTS.md). Development of this repository assumes macOS / Linux, so verify does not run here;
  # it runs the file lock tests, and checks that the bundled tarball starts without node_modules and can create a database with node:sqlite.
  # How the CLI draws in a terminal shows only on a real machine (CI cannot check it).
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15"
      - name: Install dependencies and bundle
        run: |
          set -e
          bun run setup
          bun run bundle
      # Exclusive create and rename over an existing file behave differently on Windows; init's lock and table replace rely on both
      - name: File lock and replace on Windows
        working-directory: server
        run: node --test --test-timeout=60000 test/file-lock.test.ts
      # record_check runs the save in a transaction it always rolls back, and waits like save for a lock another process holds
      - name: Rolled-back checks and the write lock on Windows
        working-directory: server
        run: |
          node --test --test-reporter=tap --test-timeout=60000 --test-name-pattern="rolled-back|record_check waits" test/db.test.ts test/reconcile.test.ts | tee rollback.tap
          # A pattern that matches no test still passes, so count the four this step is for
          grep -qx "# pass 4" rollback.tap
      # Prints how much a shell-form hook pays for starting PowerShell on each call; it never fails on the numbers
      - name: Measure hook launch directly and through PowerShell
        run: node scripts/measure-hook-launch.mjs
      - name: Does the shipped tarball start on Windows
        run: |
          set -e
          cd plugin
          tgz="$(npm pack --silent)"
          out="$(mktemp -d)"
          tar xzf "$tgz" -C "$out"
          node "$out/package/dist/cli.js" --help > /dev/null
          # On Windows, os.homedir() reads USERPROFILE.
          home="$(mktemp -d)"
          # --cwd outside the checkout, so init only creates the database and registers nothing.
          # gh gets an empty config and no token, so the runner's gh (which has no stored login) reports signed out. The line
          # also shows execFile started gh.exe: a gh that could not start says so instead
          ghconf="$(mktemp -d)"
          HOME="$home" USERPROFILE="$home" GH_CONFIG_DIR="$ghconf" GH_TOKEN='' GITHUB_TOKEN='' \
            node "$out/package/dist/cli.js" init --cwd "$home" > init.out
          cat init.out
          grep -F "GitHub account not bound: gh api user failed" init.out
          test -f "$home/.sphica/sphica.db"
          # doctor can return 1 depending on plugin install state (this runner has no plugin). Check only the DB rows.
          HOME="$home" USERPROFILE="$home" node "$out/package/dist/cli.js" doctor > doctor.out || true
          grep -E "✓ Schema version" doctor.out
          grep -E "✓ Full-text index" doctor.out
          grep -E "○ GitHub owner +none" doctor.out
          # A recording queue that cannot be read is a failure, never 0 pending. Its own HOME, so the steps below keep a usable one
          qhome="$(mktemp -d)"
          mkdir -p "$qhome/.sphica"
          : > "$qhome/.sphica/spool"
          HOME="$qhome" USERPROFILE="$qhome" node "$out/package/dist/cli.js" doctor > doctor-queue.out || true
          cat doctor-queue.out
          grep -E "✗ Recording +the queue cannot be read" doctor-queue.out
          # Does MCP start and return the tool list?
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | HOME="$home" USERPROFILE="$home" timeout 30 node "$out/package/dist/mcp.js" > mcp.out || true
          # Under pipefail, grep -q closing early makes the previous stage die of SIGPIPE, so write the output first and then check it.
          grep -q '"search"' mcp.out
          # The packed hooks, launched as hooks/hooks.json defines them, and every codex.json entry through each shell Codex can use
          node ../scripts/check-hooks-live.mjs "$out/package"
          # doctor's Codex hooks row from the packed CLI, with npm's codex.cmd on PATH as Windows installs it
          node ../scripts/check-codex-trust-live.mjs "$out/package"
