# Builds the npm release in CI and publishes it once the owner approves the `npm-release` environment; the approval is the only gate before npm.
#
# Runs when a `v<version>` tag is pushed to the PR head (before the merge). prepare checks the tag, PR, CI, and environment and builds the tarball,
# then comments on the PR with this run's URL. After the owner's approval, publish sends the same tarball to `npm publish --tag latest`,
# merge merges the PR, and finish checks what npm serves and creates the GitHub Release (.agents/skills/plugin-release/SKILL.md).
#
# No secrets. It reaches npm through trusted publishing (OIDC), with provenance.
name: release

on:
  push:
    tags: ["v*"]
  # For PRs that change the release steps and for release PRs, run everything up to publish, and finish's checks on the latest release
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-gate.mjs
      - scripts/check-tarball.mjs
      - scripts/lib/release-gate.mjs
      - scripts/lib/tarball.mjs
      - scripts/check-sbom.mjs
      - scripts/lib/sbom.mjs
      - scripts/release-env.mjs
      - scripts/lib/release-env.mjs
      - scripts/release-finish.mjs
      - scripts/lib/release-finish.mjs
      # A PR that bumps the version is a release PR, so run the same steps before the tag is pushed
      - plugin/package.json

permissions:
  contents: read

# A second run for the same tag waits instead of racing a publish that is waiting for approval
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The SBOM is built separately from the job that builds what ships (prepare). syft is fetched with a pinned checksum from its distributor (a single file with no dependencies)
  sbom:
    name: "${{ github.event_name == 'push' && format('release {0}: sbom', github.ref_name) || 'dry run: sbom' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build a CycloneDX SBOM from bun.lock
        env:
          SYFT: "1.52.0"
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSLo syft.tar.gz "https://github.com/anchore/syft/releases/download/v${SYFT}/syft_${SYFT}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          tar xzf syft.tar.gz syft
          ./syft scan "dir:$GITHUB_WORKSPACE/server" -o "cyclonedx-json=$RUNNER_TEMP/sbom.cdx.json" -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.cdx.json
          retention-days: 7
          if-no-files-found: error

  prepare:
    name: "${{ github.event_name == 'push' && format('release {0}: prepare', github.ref_name) || 'dry run: prepare' }}"
    needs: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      sha512: ${{ steps.pack.outputs.sha512 }}
      tgz: ${{ steps.pack.outputs.tgz }}
      pull: ${{ steps.gate.outputs.pull }}
      notes: ${{ steps.notes.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # This job builds what ships, so it does not read caches written by other runs (cache poisoning)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      # The tag name matches every version, the commit is the head of an open PR into main, and that PR's check and pr-body succeeded
      - name: May this tag be released
        id: gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"

      # The owner reads the Release notes before approving; finish creates the Release only from these same notes
      - name: Are the Release notes there before approval
        id: notes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ steps.gate.outputs.pull }}
        run: |
          digest="$(node scripts/release-finish.mjs --notes-digest --pull "$PULL")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The owner's approval of npm-release is the only gate before npm, so stop if anyone else could approve or bypass it
      - name: Can only the owner approve npm-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-env.mjs

      - name: Install dependencies
        run: bun run setup

      - name: Lint, types, bundle, tests, SQL reach, and the child process lane
        run: bun run verify

      # If verify rewrote tracked files, what ships would drift from the tag commit
      - name: Is the working tree still at the tag commit
        run: git diff --exit-code HEAD

      # **Ship the checked tarball as is.** The publish job does not rebuild it.
      - name: Build and check the tarball
        id: pack
        run: |
          set -e
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          tgz="$(cd plugin && npm pack --silent --pack-destination "$out")"
          node scripts/check-tarball.mjs "$out/$tgz"
          sha512="$(sha512sum "$out/$tgz" | cut -d' ' -f1)"
          integrity="sha512-$(openssl dgst -sha512 -binary "$out/$tgz" | base64 -w0)"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "sha512=$sha512" >> "$GITHUB_OUTPUT"
          {
            echo "### Checked tarball"
            echo
            echo "- file: \`$tgz\`"
            echo "- SHA-512: \`$sha512\`"
            echo "- integrity: \`$integrity\`"
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo
              echo "$GITHUB_REF_NAME waits for the owner's approval of npm-release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Does the SBOM list every bundled dependency (the THIRD_PARTY_NOTICES.md table)?
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
      - name: Compare the SBOM with the third-party notices
        run: |
          set -eo pipefail
          node scripts/check-sbom.mjs "$RUNNER_TEMP/sbom/sbom.cdx.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/release/${{ steps.pack.outputs.tgz }}
          retention-days: 7
          if-no-files-found: error

  # Runs release-finish's checks against the latest published release, so a change to them is exercised before a real release needs them
  finish-dry-run:
    name: "dry run: finish"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      attestations: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Check the latest published release as release-finish would
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-finish.mjs --dry-run

  # Tells the owner on the PR where to approve. publish does not wait for it, so a failed comment does not stop the release
  notify-approval:
    # Runs only on a tag push. GitHub does not evaluate the name of a skipped job, so the name is plain text
    name: ask for approval
    needs: prepare
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Claude also hands the run URL to the owner, so a failed comment does not fail the release run
      - name: Comment on the PR with this run's URL
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ needs.prepare.outputs.pull }}
          SHA512: ${{ needs.prepare.outputs.sha512 }}
        run: |
          set -e
          {
            echo "$GITHUB_REF_NAME waits for the owner's approval of npm-release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "SHA-512 of the checked tarball: \`$SHA512\`"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PULL" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

  publish:
    name: publish
    needs: [sbom, prepare]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Does not start until the owner approves. The trusted publisher is limited to this workflow and this environment
    environment: npm-release
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
      attestations: write
    steps:
      # The allowed endpoints are the npm destinations audit observed in the v0.37.7 release, plus nodejs.org for when setup-node cannot fetch from GitHub
      # (harden-runner allows GitHub infrastructure such as OIDC and artifacts by default)
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            nodejs.org:443
      # Stop before publishing if the block is not working
      - name: Is traffic outside the allowed endpoints blocked
        run: |
          if curl -sS --max-time 10 -o /dev/null https://example.com; then
            echo "reached an endpoint outside the allowlist" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or later. Node 24.21.0 bundles npm 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      # Check again that the environment, the PR head, and main did not change while waiting for approval
      - name: Can only the owner approve npm-release (after approval)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-env.mjs
      - name: May this tag be released (after approval)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
      # The notes the owner read must still be the PR's notes before anything irreversible happens
      - name: Are the Release notes the ones recorded before approval
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ needs.prepare.outputs.pull }}
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          digest="$(node scripts/release-finish.mjs --notes-digest --pull "$PULL")"
          if [ "$digest" != "$NOTES" ]; then
            echo "the PR's Release notes changed after prepare recorded them; ask the owner and release a new version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: ${{ runner.temp }}/release

      - name: Is it the same tarball that was checked
        env:
          TGZ: ${{ needs.prepare.outputs.tgz }}
          SHA512: ${{ needs.prepare.outputs.sha512 }}
        run: |
          set -e
          actual="$(sha512sum "$RUNNER_TEMP/release/$TGZ" | cut -d' ' -f1)"
          test "$actual" = "$SHA512"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
      # Attach the SBOM attestation to the same compared tarball (separate from npm provenance; check it with gh attestation verify)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/${{ needs.prepare.outputs.tgz }}
          sbom-path: ${{ runner.temp }}/sbom/sbom.cdx.json

      # A published version can never be published again. Do not rerun this job after this step succeeds (if it fails, bump the version and release again)
      - name: Publish to npm
        env:
          TGZ: ${{ needs.prepare.outputs.tgz }}
        run: npm publish "$RUNNER_TEMP/release/$TGZ" --tag latest --provenance

  merge:
    name: merge
    needs: [prepare, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      commit: ${{ steps.merge.outputs.commit }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Merge only the head that was tagged and published. A merge by GITHUB_TOKEN starts no other workflow, so finish runs in this run
      - name: Merge the PR at the tag commit
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ needs.prepare.outputs.pull }}
        run: |
          set -e
          # --match-head-commit pins only the head; the base could have been changed while waiting for approval
          base="$(gh pr view "$PULL" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)"
          if [ "$base" != main ]; then
            echo "PR #$PULL targets $base, not main" >&2
            exit 1
          fi
          gh pr merge "$PULL" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$GITHUB_SHA"
          commit="$(gh pr view "$PULL" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  finish:
    name: finish
    needs: [prepare, merge]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      attestations: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Check what npm serves and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ needs.prepare.outputs.pull }}
          MERGE: ${{ needs.merge.outputs.commit }}
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          set -e
          git fetch --quiet origin main
          node scripts/release-finish.mjs --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --merge "$MERGE" --pull "$PULL" --approved-notes "$NOTES"

  # When any step of a release fails, say on the PR how far it got. Whether npm has the version decides the recovery
  report-failure:
    name: report failure
    needs: [sbom, prepare, publish, merge, finish]
    if: always() && github.event_name == 'push' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Comment on the PR with the failed jobs and whether npm has the version
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          set -e
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")' <<< "$NEEDS")"
          # A successful publish decides, since the registry may answer from a cache for minutes after it. Otherwise ask npm:
          # the version may be from an earlier run, or a failed publish may have gone through (then a 404 may be that cache)
          if [ "$PUBLISH" = success ]; then
            published=yes
          elif out="$(npm view "sphica@${GITHUB_REF_NAME#v}" version 2>&1)" && [ -n "$out" ]; then
            published=yes
          elif [ "$PUBLISH" != failure ] && grep -q E404 <<< "$out"; then
            published=no
          else
            published=unknown
          fi
          {
            echo "$GITHUB_REF_NAME release failed at: $failed. On npm: $published."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Recover by following the failure paths in .agents/skills/plugin-release/SKILL.md."
          } > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          pull="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.state == "open" or .merged_at != null)][0].number // empty')"
          if [ -z "$pull" ]; then
            echo "no PR has $GITHUB_SHA as its head; the summary holds the report" >&2
            exit 1
          fi
          gh pr comment "$pull" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
