# Checks the PR body: the Verification section names the sphica:review result (only that the words are there; the owner reads it before a
# release), and every issue GitHub linked to the PR, which the release run closes, is declared on a line of its own (scripts/lib/pr-body.mjs).
# The body is untrusted: it is passed through an environment variable and never expanded into shell expressions. Fork PRs are skipped:
# they are never merged themselves, and the pull request of this repository that carries the change in holds the record.
name: pr-body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  verification-section:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    # Reads the repository for the check script and the issues GitHub linked to the pull request; nothing else is granted
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15"
          package-manager-cache: false
      - name: The Verification section names the sphica:review result
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # The template's comments also name sphica:review, so drop HTML comments before taking the section.
          # PRs opened before the English template use the Japanese heading.
          # english-exempt: the Japanese Verification heading of PRs opened before the English template
          printf '%s\n' "$BODY" | tr -d '\r' | perl -0pe 's/<!--.*?-->//gs' | awk '/^## (Verification|検証)[ \t]*$/{f=1;next} /^## /{f=0} f' > verification.txt
          grep -qF "sphica:review" verification.txt || {
            echo "The Verification section of the PR body does not name the sphica:review result (see Review in CLAUDE.md)"
            exit 1
          }
      - name: Every issue GitHub linked is declared on a line of its own
        if: ${{ !cancelled() }}
        env:
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          LINKED=$(gh pr view "$PULL" --repo "$REPO" --json closingIssuesReferences --jq '[.closingIssuesReferences[].number]')
          LINKED="$LINKED" node scripts/check-pr-body-refs.mjs
