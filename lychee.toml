# Passed by absolute path: lychee looks only in the working directory, and the tarball check runs it in the unpacked package
# External URLs fail for reasons that are not the document's (rate limits, outages), so only files, images, and anchors are checked
offline = true
# A string in lychee 0.24: `true` refuses to start
include_fragments = "anchor-only"
no_progress = true
